name: Build Lumi Voice Bridge APK

on:
  push:
    branches: ["lumi-apk-build"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract Lumi source
        run: |
          rm -rf lumi-src
          mkdir lumi-src
          unzip -q lumi-build/LumiVoiceBridge-v0.2-source.zip -d lumi-src
          mv lumi-src/LumiVoiceBridge-v0.2 lumi-src/app-project

      - name: Build debug APK
        working-directory: lumi-src/app-project
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          cp lumi-src/app-project/app/build/outputs/apk/debug/app-debug.apk LumiVoiceBridge-v0.2-debug.apk
          sha256sum LumiVoiceBridge-v0.2-debug.apk > LumiVoiceBridge-v0.2-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LumiVoiceBridge-v0.2-APK
          path: |
            LumiVoiceBridge-v0.2-debug.apk
            LumiVoiceBridge-v0.2-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
