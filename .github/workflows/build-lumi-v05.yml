name: Build Lumi v0.5 APK

on:
  push:
    branches: ["lumi-v05-build"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Reconstruct and extract source
        run: |
          base64 -d lumi-build-v05/source.b64.txt > /tmp/LumiVoiceBridge-v0.5-source.zip
          unzip -t /tmp/LumiVoiceBridge-v0.5-source.zip
          rm -rf lumi-v05-src
          mkdir lumi-v05-src
          unzip -q /tmp/LumiVoiceBridge-v0.5-source.zip -d lumi-v05-src

      - name: Build debug APK
        working-directory: lumi-v05-src/LumiVoiceBridge-v0.5
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          cp lumi-v05-src/LumiVoiceBridge-v0.5/app/build/outputs/apk/debug/app-debug.apk LumiVoiceBridge-v0.5-debug.apk
          sha256sum LumiVoiceBridge-v0.5-debug.apk > LumiVoiceBridge-v0.5-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LumiVoiceBridge-v0.5-APK
          path: |
            LumiVoiceBridge-v0.5-debug.apk
            LumiVoiceBridge-v0.5-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
